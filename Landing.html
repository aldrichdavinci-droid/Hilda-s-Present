<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Surprise</title>

    <link rel="stylesheet" href="Landing.css">
</head>

<body>

    <div class="card">

        <h2>Welcome 💗</h2>

        <p>Enter your details to continue</p>

        <form id="loginForm">

            <label for="Uname">Username:</label>

            <input
                id="Uname"
                type="text"
                placeholder="What is our signature name?"
                required
            >

            <label for="password">Password:</label>

            <input
                id="password"
                type="password"
                placeholder="What evil name do I use to call you?"
                required
            >

            <button type="submit">
                Enter 💕
            </button>

            <p id="errorMessage"></p>

        </form>

    </div>

    <script src="Landing.js"></script>

</body>
</html>
